name: 抓取 YouBike 即時資料

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/**
      - tests/**
      - .github/workflows/fetch.yml
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: station-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 驗證名單與歷史保存
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs

      - name: 執行抓取
        id: collect
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python scripts/fetch_tdx.py

      - name: Commit 資料
        if: ${{ always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "資料更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
